name: PerMark
repo: https://github.com/EdelmarSchneider/permark
tagline: "PerMark: a Markdown app to read and review what your AI agents write, and steer the work through its documents."
description: >-
  Open any Markdown (.md) file as a clean page, with tables, diagrams and math. Keep notes that save themselves. Working with AI? See what it changed since you last looked, and keep or revert each change. AI speeds the work. Your vision steers it. Markdown app that tells your AI agents what you are reading: the open document, section and selection, unread changes, your comments to mark done, and search across the project. Local; agents never edit through it; off until you share a project.
